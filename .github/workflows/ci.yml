name: SongPad CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358

jobs:
  # Fast PR gate: boundaries, JVM tier, every module's unit tests, lint, native build via assembleDebug.
  pr-validation:
    name: Boundaries, Unit Tests, Lint, Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: vendor-lame
        run: ./scripts/vendor_lame.sh

      - name: Module boundaries
        run: ./gradlew checkModuleBoundaries --console=plain

      - name: JVM tier (pure Kotlin)
        run: ./gradlew :core:model:test :core:data:testing:test :spikes:s4-fts5:test --continue --console=plain

      - name: Android module unit tests
        run: ./gradlew testDebugUnitTest --continue --console=plain

      - name: Lint
        run: ./gradlew lintDebug --continue --console=plain

      - name: Assemble Debug (includes the Oboe native build)
        run: ./gradlew assembleDebug --console=plain

      - name: S-4 spike report
        run: ./gradlew :spikes:s4-fts5:run --console=plain

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            docs/spikes/S-4-report.md

  # Main Branch Gate: Instrumented Emulator Tests (API 30 & API 35) — Room, migrations, FTS on device SQLite path.
  instrumented-tests:
    name: Instrumented Tests (API 30 & API 35)
    needs: pr-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        api-level: [30, 35]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;3.22.1"

      - name: vendor-lame
        run: ./scripts/vendor_lame.sh

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Tests via Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew connectedDebugAndroidTest --console=plain

  # Package APK for Team Physical Device Testing (Pixel, Samsung, Xiaomi, Transsion) — spikes S-1/S-2/S-3/S-5.
  package-device-build:
    name: Package APK for Physical Device Testing
    needs: pr-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;3.22.1"

      - name: vendor-lame
        run: ./scripts/vendor_lame.sh

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APK for Physical Testing
        uses: actions/upload-artifact@v4
        with:
          name: songpad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
